evaluate_now:
  name: Regeln jetzt auswerten
  description: Bewertet Temperatur, Leistungsdaten und Strompreis sofort. Optional wird die geplante Aktion direkt ausgefuehrt.
  fields:
    config_entry_id:
      name: Konfigurationseintrag-ID
      description: Optionale ID eines Konfigurationseintrags, wenn gezielt ein bestimmter Eintrag angesprochen werden soll.
      selector:
        text:
    apply:
      name: Aktion ausfuehren
      description: Fuehrt eine geplante Schaltaktion ueber homeassistant.turn_on oder homeassistant.turn_off aus.
      default: false
      selector:
        boolean:

set_enabled:
  name: Regel-Engine aktivieren
  description: Aktiviert oder deaktiviert die Regel-Engine.
  fields:
    config_entry_id:
      name: Konfigurationseintrag-ID
      selector:
        text:
    enabled:
      name: Aktiviert
      required: true
      selector:
        boolean:

set_simulation:
  name: Simulation setzen
  description: Aktiviert oder deaktiviert den Simulationsmodus. Im Simulationsmodus werden Entscheidungen berechnet, aber nicht geschaltet.
  fields:
    config_entry_id:
      name: Konfigurationseintrag-ID
      selector:
        text:
    enabled:
      name: Simulation aktiv
      required: true
      selector:
        boolean:

set_setting:
  name: Laufzeit-Einstellung setzen
  description: Setzt eine numerische Regel-Einstellung ohne Neustart.
  fields:
    config_entry_id:
      name: Konfigurationseintrag-ID
      selector:
        text:
    setting:
      name: Einstellung
      required: true
      selector:
        select:
          options:
            - compressor_running_watts
            - min_on_seconds
            - min_off_seconds
            - cheap_on_temp
            - cheap_off_temp
            - expensive_on_temp
            - expensive_off_temp
    value:
      name: Wert
      required: true
      selector:
        number:
          mode: box
          step: 0.1
