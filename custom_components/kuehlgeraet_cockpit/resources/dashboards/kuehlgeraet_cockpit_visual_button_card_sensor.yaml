type: custom:button-card
entity: sensor.kuehlgeraet_cockpit_status
name: Kuehlgeraet Cockpit
show_icon: true
show_state: true
icon: mdi:fridge-outline
tap_action:
  action: navigate
  navigation_path: /kuehlgeraet-cockpit
hold_action:
  action: more-info
styles:
  card:
    - padding: 16px
    - border-radius: 8px
  name:
    - font-weight: 700
  custom_fields:
    details:
      - justify-self: stretch
      - text-align: left
      - line-height: 1.45
custom_fields:
  details: |
    [[[
      const data = entity?.attributes || {};
      const safe = (value, fallback='-') => (
        value === undefined || value === null || value === '' ? fallback : value
      );
      const pct = Math.round(Number(data.price_factor ?? 0.5) * 100);
      return `
        <div style="margin-top:12px;">
          <div><b>Aktion:</b> ${safe(data.planned_action)}</div>
          <div><b>Temperatur:</b> ${safe(data.temperature_c)} C</div>
          <div><b>Preisfaktor:</b> ${pct}%</div>
          <div><b>Schwellen:</b> EIN ${safe(data.selected_on_temp)} C / AUS ${safe(data.selected_off_temp)} C</div>
          <div><b>Grund:</b> ${safe(data.reason)}</div>
        </div>
      `;
    ]]]
