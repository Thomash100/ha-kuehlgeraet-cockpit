type: markdown
title: Kuehlgeraet Cockpit
content: >-
  {% set entity = 'sensor.kuehlgeraet_cockpit_status' %}

  **Modus:** {{ states(entity) }}

  **Geplante Aktion:** {{ state_attr(entity, 'planned_action') | default('-') }}

  **Ziel:** {{ state_attr(entity, 'target_entity') | default('-') }} / {{ state_attr(entity, 'target_state') | default('-') }}

  **Temperatur:** {{ state_attr(entity, 'temperature_c') | default('-') }} C

  **Leistung:** {{ state_attr(entity, 'power_w') | default('-') }} W

  **Strompreis:** {{ state_attr(entity, 'price') | default('-') }}

  **Preisfaktor:** {{ ((state_attr(entity, 'price_factor') | default(0.5)) | float * 100) | round(0) }} %

  **Schwellen:** EIN {{ state_attr(entity, 'selected_on_temp') | default('-') }} C / AUS {{ state_attr(entity, 'selected_off_temp') | default('-') }} C

  **Grund:** {{ state_attr(entity, 'reason') | default('-') }}

  _Aktualisiert: {{ state_attr(entity, 'updated_at') | default('-') }}_
